<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Acesso Restrito | Login</title>
</head>
<body class="bg-slate-900 flex items-center justify-center min-h-screen px-4">
    <div class="bg-white p-8 rounded-2xl shadow-2xl w-full max-w-md">
        <div class="text-center mb-10">
            <h1 class="text-3xl font-bold text-slate-800">Nexus Admin</h1>
            <p class="text-slate-500 mt-2">Introduza as suas credenciais para continuar</p>
        </div>

        <form method="post" class="space-y-6">
            {% csrf_token %}
            
            {% if form.errors %}
                <div class="p-3 bg-red-100 border border-red-200 text-red-600 rounded-lg text-sm">
                    Utilizador ou palavra-passe incorretos.
                </div>
            {% endif %}

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Utilizador</label>
                <input type="text" name="username" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200">
            </div>

            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Palavra-passe</label>
                <input type="password" name="password" required 
                    class="w-full px-4 py-3 rounded-xl border border-slate-300 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 outline-none transition duration-200">
            </div>

            <button type="submit" 
                class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-3 rounded-xl transition duration-300 shadow-lg shadow-blue-200 active:scale-95">
                Entrar no Sistema
            </button>
        </form>

        <div class="mt-8 text-center border-t border-slate-100 pt-6">
            <a href="{% url 'landpage' %}" class="text-sm text-blue-600 hover:underline font-medium">
                ← Voltar para a Landpage
            </a>
        </div>
    </div>
</body>
</html>
