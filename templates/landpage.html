<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <script src="https://cdn.tailwindcss.com"></script>
    <title>Mupi Software House</title>
</head>
<body class="bg-slate-50 text-slate-800">
    <header class="bg-gradient-to-r from-blue-700 to-indigo-800 text-white py-20 px-6 text-center">
        <h1 class="text-5xl font-extrabold mb-4">Inovação que transforma.</h1>
        <p class="text-xl opacity-90">Desenvolvemos soluções digitais sob medida para o seu negócio.</p>
    </header>

    <main class="max-w-4xl mx-auto -mt-10 bg-white p-8 rounded-2xl shadow-xl mb-20">
        <h2 class="text-2xl font-bold mb-6 text-center">Inicie seu projeto conosco</h2>
        
        {% if messages %}
            {% for message in messages %}
                <div class="mb-6 p-4 bg-green-100 text-green-700 rounded-lg border border-green-200">
                    {{ message }}
                </div>
            {% endfor %}
        {% endif %}

        <form method="post" class="space-y-4">
            {% csrf_token %}
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div><label class="block mb-1 font-medium">Nome</label>{{ form.nome }}</div>
                <div><label class="block mb-1 font-medium">E-mail</label>{{ form.email }}</div>
            </div>
            <div><label class="block mb-1 font-medium">Assunto</label>{{ form.assunto }}</div>
            <div><label class="block mb-1 font-medium">Mensagem</label>{{ form.mensagem }}</div>
            <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white font-bold py-4 rounded-xl transition shadow-lg">
                Enviar Mensagem
            </button>
        </form>
    </main>
</body>
</html>
